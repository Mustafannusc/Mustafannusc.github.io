name: Sync Lab Logo Across Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-logo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add lab logo to root HTML pages
        shell: python
        run: |
          from pathlib import Path
          import re

          changed = []
          logo_block = '''
    <div class="lab-logo-box">
      <img src="/LOG%20MY%20LAB.gif"
           alt="Material Innovation Solutions Lab logo"
           class="lab-logo">
    </div>
'''

          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              if 'class="lab-logo-box"' in text:
                  continue
              if 'class="sidebar"' not in text:
                  continue

              pattern = r'(<(?:aside|div) class="sidebar">\s*<h2>.*?</h2>)'
              new_text, n = re.subn(pattern, lambda m: m.group(1) + '\n' + logo_block.rstrip('\n'), text, count=1, flags=re.S)
              if n:
                  path.write_text(new_text, encoding='utf-8')
                  changed.append(str(path))

          print('Updated:', ', '.join(changed) if changed else 'none')

      - name: Commit logo updates
        run: |
          if git diff --quiet; then
            echo "No logo updates needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Add Material Innovation Lab logo across site"
          git push
