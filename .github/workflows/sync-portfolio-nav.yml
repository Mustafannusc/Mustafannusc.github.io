name: Sync Research Portfolio Navigation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-navigation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync full navigation across site and portfolio pages
        shell: python
        run: |
          from pathlib import Path
          import re

          changed = []

          # Keep the Research Portfolio link on root-level HTML pages.
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              if 'portfolio/index.html' in text:
                  continue

              lines = text.splitlines()
              inserted = False
              for i, line in enumerate(lines):
                  if re.search(r'<li><a(?: class="active")? href="projects\.html">Projects</a></li>', line):
                      indent = re.match(r'\s*', line).group(0)
                      lines.insert(i + 1, indent + '<li><a href="portfolio/index.html">Research Portfolio</a></li>')
                      inserted = True
                      break

              if inserted:
                  ending = '\n' if text.endswith('\n') else ''
                  path.write_text('\n'.join(lines) + ending, encoding='utf-8')
                  changed.append(str(path))

          # Portfolio/project pages retain their project-specific links while also
          # showing the complete global site navigation visible on Homepage.
          global_before = [
              ('Biography', '/biography.html'),
              ('Research Interests', '/research.html'),
              ('Publications', '/publications.html'),
              ('Projects', '/projects.html'),
          ]

          global_after = [
              ('Teaching', '/teaching.html'),
              ('Grants & Funding', '/grants.html'),
              ('Code & Tools', '/code.html'),
              ('References & Service', '/references.html'),
              ('Reviewer & Editorial Service', '/reviewer-service.html'),
              ('Gallery', '/gallery.html'),
              ('Contact', '/contact.html'),
              ('Services', '/services.html'),
          ]

          for path in Path('portfolio').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              m = re.search(r'(<ul class="nav">)(.*?)(</ul>)', text, flags=re.S)
              if not m:
                  continue

              block = m.group(2)
              original_block = block

              # Insert any missing global links before Research Portfolio.
              before_additions = []
              for label, href in global_before:
                  if f'>{label}</a>' not in block:
                      before_additions.append(f'<li><a href="{href}">{label}</a></li>')

              if before_additions:
                  portfolio_line = re.search(r'(^\s*<li><a[^>]*>Research Portfolio</a></li>)', block, flags=re.M)
                  if portfolio_line:
                      insert_text = '\n'.join(before_additions) + '\n'
                      block = block[:portfolio_line.start()] + insert_text + block[portfolio_line.start():]

              # Append missing global links after project-specific navigation.
              after_additions = []
              for label, href in global_after:
                  if f'>{label}</a>' not in block:
                      after_additions.append(f'<li><a href="{href}">{label}</a></li>')

              if after_additions:
                  block = block.rstrip() + '\n' + '\n'.join(after_additions) + '\n'

              if block != original_block:
                  new_text = text[:m.start(2)] + block + text[m.end(2):]
                  path.write_text(new_text, encoding='utf-8')
                  changed.append(str(path))

          print('Updated:', ', '.join(changed) if changed else 'none')

      - name: Compact global sidebar navigation spacing
        shell: python
        run: |
          from pathlib import Path

          path = Path('style.css')
          text = path.read_text(encoding='utf-8')
          original = text

          text = text.replace(
              '.nav li {\n    margin-bottom: 8px;\n}',
              '.nav li {\n    margin-bottom: 2px;\n}',
              1,
          )
          text = text.replace(
              '.nav a {\n    display: block;\n    padding: 7px 10px;',
              '.nav a {\n    display: block;\n    padding: 4px 8px;',
              1,
          )
          text = text.replace(
              '    margin-bottom: 25px;\n    font-size: 20px;',
              '    margin-bottom: 12px;\n    font-size: 20px;',
              1,
          )
          text = text.replace(
              '    margin: 0 0 12px 0;\n    padding: 0;',
              '    margin: 0 0 7px 0;\n    padding: 0;',
              1,
          )

          if text != original:
              path.write_text(text, encoding='utf-8')
              print('Compacted sidebar spacing in style.css')
          else:
              print('Sidebar spacing already compact')

      - name: Compact global page vertical spacing
        shell: python
        run: |
          from pathlib import Path

          path = Path('style.css')
          text = path.read_text(encoding='utf-8')
          original = text

          replacements = [
              ('    padding: 30px 28px;\n}', '    padding: 18px 24px;\n}'),
              ('    margin-top: 30px;\n    margin-bottom: 10px;', '    margin-top: 18px;\n    margin-bottom: 7px;'),
              ('p {\n    margin: 10px 0;\n}', 'p {\n    margin: 6px 0;\n}'),
              ('ul {\n    margin-top: 10px;\n    margin-bottom: 20px;', 'ul {\n    margin-top: 6px;\n    margin-bottom: 12px;'),
              ('li {\n    margin-bottom: 6px;\n}', 'li {\n    margin-bottom: 4px;\n}'),
              ('    margin: 15px 0 25px 0;\n}', '    margin: 8px 0 14px 0;\n}'),
              ('    margin: 0 0 24px 0;\n    padding: 18px 22px;', '    margin: 0 0 12px 0;\n    padding: 12px 18px;'),
              ('    padding: 28px 30px;\n    margin-bottom: 28px;', '    padding: 20px 24px;\n    margin-bottom: 14px;'),
              ('    margin-bottom: 24px;\n    padding: 22px 26px;', '    margin-bottom: 14px;\n    padding: 16px 20px;'),
              ('    margin-bottom: 18px;\n}', '    margin-bottom: 10px;\n}'),
              ('    margin: 12px 0 20px 0;\n}', '    margin: 8px 0 12px 0;\n}'),
          ]

          for old, new in replacements:
              text = text.replace(old, new, 1)

          # Compact common section-heading boxes without changing typography.
          text += '''\n/* ==========================================================\n   GLOBAL COMPACT VERTICAL RHYTHM\n   Reduces unused whitespace while preserving page hierarchy.\n   ========================================================== */\n.content > h2,\n.home-card > h2,\n.teaching-section > h2,\n.review-year > h2,\n.pub-year > h2 {\n    margin-top: 14px !important;\n    margin-bottom: 7px !important;\n    padding-top: 6px !important;\n    padding-bottom: 6px !important;\n}\n\n.home-card {\n    margin-top: 10px !important;\n    margin-bottom: 12px !important;\n}\n\n.content > hr {\n    margin-top: 7px !important;\n    margin-bottom: 12px !important;\n}\n\n@media (max-width: 800px) {\n    .content {\n        padding-top: 8px !important;\n        padding-bottom: 12px !important;\n    }\n\n    .content > h1:first-child {\n        margin-bottom: 7px !important;\n    }\n}\n'''

          if text != original:
              path.write_text(text, encoding='utf-8')
              print('Compacted global page spacing in style.css')
          else:
              print('Global page spacing already compact')

      - name: Commit navigation updates
        run: |
          if git diff --quiet; then
            echo "No navigation updates needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' 'portfolio/**/*.html' 'style.css'
          git commit -m "Sync navigation and compact site spacing"
          git push
