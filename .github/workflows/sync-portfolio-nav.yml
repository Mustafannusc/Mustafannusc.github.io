name: Sync Research Portfolio Navigation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-navigation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add Research Portfolio link to root HTML pages
        shell: python
        run: |
          from pathlib import Path
          import re

          portfolio_link = '      <li><a href="portfolio/index.html">Research Portfolio</a></li>'
          changed = []

          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              if 'portfolio/index.html' in text:
                  continue

              lines = text.splitlines()
              inserted = False
              for i, line in enumerate(lines):
                  if re.search(r'<li><a(?: class="active")? href="projects\.html">Projects</a></li>', line):
                      indent = re.match(r'\s*', line).group(0)
                      lines.insert(i + 1, indent + '<li><a href="portfolio/index.html">Research Portfolio</a></li>')
                      inserted = True
                      break

              if inserted:
                  ending = '\n' if text.endswith('\n') else ''
                  path.write_text('\n'.join(lines) + ending, encoding='utf-8')
                  changed.append(str(path))

          print('Updated:', ', '.join(changed) if changed else 'none')

      - name: Commit navigation updates
        run: |
          if git diff --quiet; then
            echo "No navigation updates needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Add Research Portfolio link across site navigation"
          git push
