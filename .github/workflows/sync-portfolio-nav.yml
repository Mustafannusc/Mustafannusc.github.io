name: Sync Research Portfolio Navigation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-navigation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync full navigation across site and portfolio pages
        shell: python
        run: |
          from pathlib import Path
          import re

          changed = []

          # Keep the Research Portfolio link on root-level HTML pages.
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              if 'portfolio/index.html' in text:
                  continue

              lines = text.splitlines()
              inserted = False
              for i, line in enumerate(lines):
                  if re.search(r'<li><a(?: class="active")? href="projects\.html">Projects</a></li>', line):
                      indent = re.match(r'\s*', line).group(0)
                      lines.insert(i + 1, indent + '<li><a href="portfolio/index.html">Research Portfolio</a></li>')
                      inserted = True
                      break

              if inserted:
                  ending = '\n' if text.endswith('\n') else ''
                  path.write_text('\n'.join(lines) + ending, encoding='utf-8')
                  changed.append(str(path))

          # Portfolio/project pages retain their project-specific links while also
          # showing the complete global site navigation visible on Homepage.
          global_before = [
              ('Biography', '/biography.html'),
              ('Research Interests', '/research.html'),
              ('Publications', '/publications.html'),
              ('Projects', '/projects.html'),
          ]

          global_after = [
              ('Teaching', '/teaching.html'),
              ('Grants & Funding', '/grants.html'),
              ('Code & Tools', '/code.html'),
              ('References & Service', '/references.html'),
              ('Reviewer & Editorial Service', '/reviewer-service.html'),
              ('Gallery', '/gallery.html'),
              ('Contact', '/contact.html'),
              ('Services', '/services.html'),
          ]

          for path in Path('portfolio').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              m = re.search(r'(<ul class="nav">)(.*?)(</ul>)', text, flags=re.S)
              if not m:
                  continue

              block = m.group(2)
              original_block = block

              before_additions = []
              for label, href in global_before:
                  if f'>{label}</a>' not in block:
                      before_additions.append(f'<li><a href="{href}">{label}</a></li>')

              if before_additions:
                  portfolio_line = re.search(r'(^\s*<li><a[^>]*>Research Portfolio</a></li>)', block, flags=re.M)
                  if portfolio_line:
                      insert_text = '\n'.join(before_additions) + '\n'
                      block = block[:portfolio_line.start()] + insert_text + block[portfolio_line.start():]

              after_additions = []
              for label, href in global_after:
                  if f'>{label}</a>' not in block:
                      after_additions.append(f'<li><a href="{href}">{label}</a></li>')

              if after_additions:
                  block = block.rstrip() + '\n' + '\n'.join(after_additions) + '\n'

              if block != original_block:
                  new_text = text[:m.start(2)] + block + text[m.end(2):]
                  path.write_text(new_text, encoding='utf-8')
                  changed.append(str(path))

          print('Updated:', ', '.join(changed) if changed else 'none')

      - name: Compact global sidebar navigation spacing
        shell: python
        run: |
          from pathlib import Path

          path = Path('style.css')
          text = path.read_text(encoding='utf-8')
          original = text

          text = text.replace(
              '.nav li {\n    margin-bottom: 8px;\n}',
              '.nav li {\n    margin-bottom: 2px;\n}',
              1,
          )
          text = text.replace(
              '.nav a {\n    display: block;\n    padding: 7px 10px;',
              '.nav a {\n    display: block;\n    padding: 4px 8px;',
              1,
          )
          text = text.replace(
              '    margin-bottom: 25px;\n    font-size: 20px;',
              '    margin-bottom: 12px;\n    font-size: 20px;',
              1,
          )
          text = text.replace(
              '    margin: 0 0 12px 0;\n    padding: 0;',
              '    margin: 0 0 7px 0;\n    padding: 0;',
              1,
          )

          if text != original:
              path.write_text(text, encoding='utf-8')
              print('Compacted sidebar spacing in style.css')
          else:
              print('Sidebar spacing already compact')

      - name: Compact vertical spacing across all main pages
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('style.css')
          text = path.read_text(encoding='utf-8')
          original = text

          # Remove any previous generated compact-spacing blocks so the workflow is idempotent.
          text = re.sub(
              r'\n?/\* === GLOBAL MAIN-PAGE COMPACT SPACING START === \*/.*?/\* === GLOBAL MAIN-PAGE COMPACT SPACING END === \*/\n?',
              '\n',
              text,
              flags=re.S,
          )
          text = re.sub(
              r'\n?/\* ==========================================================\n   GLOBAL COMPACT VERTICAL RHYTHM.*?@media \(max-width: 800px\) \{.*?\n\}\n',
              '\n',
              text,
              flags=re.S,
          )

          compact = r'''
/* === GLOBAL MAIN-PAGE COMPACT SPACING START === */
/* Applies consistently from Homepage through Services while preserving typography. */

.content {
    padding-top: 18px !important;
    padding-bottom: 18px !important;
}

.content > h1:first-child,
.home-hero,
.publications-hero,
.teaching-hero,
.reviewer-hero,
.grants-hero {
    margin-bottom: 12px !important;
}

.content > h1:first-child {
    padding-top: 12px !important;
    padding-bottom: 12px !important;
}

.content > h2,
.home-card > h2,
.teaching-section > h2,
.review-year > h2,
.pub-year > h2,
.grant-year > h2 {
    margin-top: 12px !important;
    margin-bottom: 6px !important;
    padding-top: 6px !important;
    padding-bottom: 6px !important;
}

.content p {
    margin-top: 5px;
    margin-bottom: 5px;
}

.content ul,
.content ol {
    margin-top: 5px;
    margin-bottom: 10px;
}

.content li {
    margin-bottom: 3px;
}

.content > hr,
.content section > hr {
    margin-top: 7px !important;
    margin-bottom: 10px !important;
}

.home-card,
.paper-entry,
.teaching-card,
.teaching-wide-card,
.publication-note,
.reviewer-note,
.grant-card,
.impact-card,
.card,
.media-card {
    margin-top: 8px !important;
    margin-bottom: 10px !important;
}

.home-card {
    padding-top: 15px !important;
    padding-bottom: 15px !important;
}

.teaching-section,
.pub-year,
.review-year,
.grant-year {
    margin-top: 18px !important;
    margin-bottom: 20px !important;
}

.profile-links {
    margin-top: 8px !important;
    margin-bottom: 10px !important;
}

@media (max-width: 800px) {
    .content {
        padding-top: 8px !important;
        padding-bottom: 12px !important;
    }

    .content > h1:first-child,
    .home-hero,
    .publications-hero,
    .teaching-hero,
    .reviewer-hero,
    .grants-hero {
        margin-bottom: 7px !important;
    }

    .content > h2,
    .home-card > h2,
    .teaching-section > h2,
    .review-year > h2,
    .pub-year > h2,
    .grant-year > h2 {
        margin-top: 9px !important;
        margin-bottom: 5px !important;
    }
}
/* === GLOBAL MAIN-PAGE COMPACT SPACING END === */
'''

          text = text.rstrip() + '\n' + compact

          if text != original:
              path.write_text(text, encoding='utf-8')
              print('Applied compact spacing globally from Homepage through Services')
          else:
              print('Global compact spacing already current')

      - name: Commit navigation updates
        run: |
          if git diff --quiet; then
            echo "No navigation or spacing updates needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' 'portfolio/**/*.html' 'style.css'
          git commit -m "Sync navigation and compact spacing across all main pages"
          git push
