name: Sync Research Portfolio Navigation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-navigation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync full navigation across site and portfolio pages
        shell: python
        run: |
          from pathlib import Path
          import re

          changed = []

          # Keep the Research Portfolio link on root-level HTML pages.
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              if 'portfolio/index.html' in text:
                  continue

              lines = text.splitlines()
              inserted = False
              for i, line in enumerate(lines):
                  if re.search(r'<li><a(?: class="active")? href="projects\.html">Projects</a></li>', line):
                      indent = re.match(r'\s*', line).group(0)
                      lines.insert(i + 1, indent + '<li><a href="portfolio/index.html">Research Portfolio</a></li>')
                      inserted = True
                      break

              if inserted:
                  ending = '\n' if text.endswith('\n') else ''
                  path.write_text('\n'.join(lines) + ending, encoding='utf-8')
                  changed.append(str(path))

          # Portfolio/project pages should retain their project-specific links,
          # while also showing the complete site navigation visible on Homepage.
          global_after = [
              ('Teaching', '/teaching.html'),
              ('Grants & Funding', '/grants.html'),
              ('Code & Tools', '/code.html'),
              ('References & Service', '/references.html'),
              ('Reviewer & Editorial Service', '/reviewer-service.html'),
              ('Gallery', '/gallery.html'),
              ('Contact', '/contact.html'),
              ('Services', '/services.html'),
          ]

          for path in Path('portfolio').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              m = re.search(r'(<ul class="nav">)(.*?)(</ul>)', text, flags=re.S)
              if not m:
                  continue

              block = m.group(2)
              original_block = block

              # Add Biography after Homepage if this older project navigation omits it.
              if '>Biography</a>' not in block:
                  block = re.sub(
                      r'(<li><a(?: class="active")? href="[^"]*index\.html">Homepage</a></li>)',
                      r'\1\n<li><a href="/biography.html">Biography</a></li>',
                      block,
                      count=1,
                  )

              # Append any missing global links after project-specific navigation.
              additions = []
              for label, href in global_after:
                  if f'>{label}</a>' not in block:
                      additions.append(f'<li><a href="{href}">{label}</a></li>')

              if additions:
                  block = block.rstrip() + '\n' + '\n'.join(additions) + '\n'

              if block != original_block:
                  new_text = text[:m.start(2)] + block + text[m.end(2):]
                  path.write_text(new_text, encoding='utf-8')
                  changed.append(str(path))

          print('Updated:', ', '.join(changed) if changed else 'none')

      - name: Commit navigation updates
        run: |
          if git diff --quiet; then
            echo "No navigation updates needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' 'portfolio/**/*.html'
          git commit -m "Sync full navigation across portfolio pages"
          git push
